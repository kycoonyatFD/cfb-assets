    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            min-height: 100vh;
            padding: 20px;
            color: #e2e8f0;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 1.1em;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            align-items: center;
        }

        input[type="text"] {
            flex: 1;
            min-width: 250px;
            padding: 12px 16px;
            border: 2px solid #475569;
            border-radius: 8px;
            background: #1e293b;
            color: #e2e8f0;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #60a5fa;
        }

        input[type="text"]::placeholder {
            color: #64748b;
        }

        .filter-select {
            padding: 12px 16px;
            border: 2px solid #475569;
            border-radius: 8px;
            background: #1e293b;
            color: #e2e8f0;
            font-size: 1em;
            cursor: pointer;
            transition: border-color 0.3s;
        }

        .filter-select:focus {
            outline: none;
            border-color: #60a5fa;
        }

        .view-toggle {
            display: flex;
            gap: 5px;
            border: 2px solid #475569;
            border-radius: 8px;
            background: #1e293b;
            padding: 5px;
        }

        .view-toggle button {
            padding: 8px 12px;
            border: none;
            background: transparent;
            color: #e2e8f0;
            cursor: pointer;
            border-radius: 6px;
            font-size: 0.95em;
            font-weight: 600;
            transition: all 0.3s;
        }

        .view-toggle button.active {
            background: #3b82f6;
            color: white;
        }

        .view-toggle button:hover {
            background: #334155;
        }

        .teams-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 15px;
            margin-bottom: 40px;
        }

        .teams-grid.list-view {
            grid-template-columns: 1fr;
            gap: 10px;
        }

        .team-card {
            background: #0f172a;
            border: 2px solid #334155;
            border-radius: 12px;
            padding: 15px;
            transition: all 0.3s;
            cursor: pointer;
            border-left: 5px solid #3b82f6;
        }

        .team-card[data-color] {
            border-left: 5px solid;
        }

        .teams-grid.list-view .team-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 15px;
        }

        .teams-grid.list-view .team-info {
            flex: 1;
        }

        .teams-grid.list-view .button-container {
            flex: 0 0 auto;
            gap: 8px;
            width: auto;
        }

        .teams-grid.list-view .copy-button, .teams-grid.list-view .view-button {
            padding: 8px 12px;
            white-space: nowrap;
            flex: 0 1 auto;
        }

        .teams-grid.list-view .url-preview {
            display: none;
        }

        .team-card:hover {
            border-color: #60a5fa;
            transform: translateY(-4px);
            box-shadow: 0 10px 30px rgba(96, 165, 250, 0.1);
        }

        .team-id {
            display: inline-block;
            background: #334155;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.85em;
            color: #cbd5e1;
            margin-bottom: 8px;
        }

        .team-name {
            font-size: 1.3em;
            font-weight: 600;
            margin-bottom: 8px;
            color: #f1f5f9;
        }

        .team-short {
            color: #94a3b8;
            font-size: 0.95em;
            margin-bottom: 12px;
        }

        .team-location {
            color: #64748b;
            font-size: 0.9em;
            margin-bottom: 16px;
        }

        .button-container {
            display: flex;
            gap: 10px;
            width: 100%;
        }

        .copy-button, .view-button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 6px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.95em;
        }

        .copy-button {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
        }

        .view-button {
            background: linear-gradient(135deg, #8b5cf6, #ec4899);
        }

        .copy-button:hover {
            transform: scale(1.02);
            box-shadow: 0 5px 15px rgba(59, 130, 246, 0.3);
        }

        .view-button:hover {
            transform: scale(1.02);
            box-shadow: 0 5px 15px rgba(139, 92, 246, 0.3);
        }

        .copy-button:active, .view-button:active {
            transform: scale(0.98);
        }

        .copy-button.copied {
            background: linear-gradient(135deg, #10b981, #06b6d4);
        }

        .copy-button.copy-error {
            background: linear-gradient(135deg, #ef4444, #dc2626);
        }

        .url-preview {
            background: #1e293b;
            padding: 12px;
            border-radius: 6px;
            margin-top: 12px;
            font-size: 0.8em;
            color: #cbd5e1;
            word-break: break-all;
            font-family: 'Monaco', 'Courier New', monospace;
        }

        .results-count {
            text-align: center;
            color: #94a3b8;
            margin-bottom: 20px;
            font-size: 1.1em;
        }

        .no-results {
            text-align: center;
            padding: 40px 20px;
            color: #94a3b8;
            font-size: 1.2em;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.8em;
            }

            .search-box {
                flex-direction: column;
            }

            input[type="text"],
            .filter-select {
                width: 100%;
            }

            .teams-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

        const searchInput = document.getElementById('searchInput');
        const filterSelect = document.getElementById('filterSelect');
        const teamsContainer = document.getElementById('teamsContainer');
        const resultsCount = document.getElementById('resultsCount');
        const noResults = document.getElementById('noResults');

        function generateImageUrl(id) {
            return `https://d17odppiik753x.cloudfront.net/playerimages/cfb/300x300/${id}.png`;
        }

        function renderTeams(teamsToRender) {
            teamsContainer.innerHTML = '';

            if (teamsToRender.length === 0) {
                teamsContainer.style.display = 'none';
                noResults.style.display = 'block';
                resultsCount.textContent = '';
                return;
            }

            teamsContainer.style.display = 'grid';
            noResults.style.display = 'none';
            resultsCount.textContent = `${teamsToRender.length} team${teamsToRender.length !== 1 ? 's' : ''} found`;

            teamsToRender.forEach(team => {
                const url = generateImageUrl(team.id);
                const card = document.createElement('div');
                card.className = 'team-card';
                card.style.borderLeftColor = team.color;
                card.innerHTML = `
                    <div class="team-id">ID: ${team.id}</div>
                    <div class="team-name">${team.full}</div>
                    <div class="team-short">${team.code} • ${team.short}</div>
                    <div class="team-location">${team.location}</div>
                    <div class="button-container">
                        <button class="copy-button" data-url="${url}" data-team="${team.full}">
                            📋 Copy URL
                        </button>
                        <button class="view-button" data-url="${url}">
                            👁️ View Image
                        </button>
                    </div>
                    <div class="url-preview">${url}</div>
                `;

                const copyButton = card.querySelector('.copy-button');
                const viewButton = card.querySelector('.view-button');

                copyButton.addEventListener('click', async () => {
                    let copied = false;

                    // Try modern Clipboard API first
                    if (navigator.clipboard && navigator.clipboard.writeText) {
                        try {
                            await navigator.clipboard.writeText(url);
                            copied = true;
                        } catch (err) {
                            console.log('Clipboard API failed, trying fallback...');
                        }
                    }

                    // Fallback: try older document.execCommand method
                    if (!copied) {
                        try {
                            const textArea = document.createElement('textarea');
                            textArea.value = url;
                            textArea.style.position = 'fixed';
                            textArea.style.opacity = '0';
                            document.body.appendChild(textArea);
                            textArea.select();
                            document.execCommand('copy');
                            document.body.removeChild(textArea);
                            copied = true;
                        } catch (err) {
                            console.log('Fallback copy failed too');
                        }
                    }

                    // Show success or fallback UI
                    if (copied) {
                        copyButton.textContent = '✓ Copied!';
                        copyButton.classList.add('copied');
                        setTimeout(() => {
                            copyButton.textContent = '📋 Copy URL';
                            copyButton.classList.remove('copied');
                        }, 2000);
                    } else {
                        // Last resort: show text input for manual copy
                        copyButton.textContent = '📝 Click to Copy';
                        const input = document.createElement('input');
                        input.type = 'text';
                        input.value = url;
                        input.style.position = 'fixed';
                        input.style.opacity = '0';
                        document.body.appendChild(input);
                        input.select();
                        input.focus();
                        setTimeout(() => {
                            document.body.removeChild(input);
                            copyButton.textContent = '📋 Copy URL';
                        }, 100);
                    }
                });

                viewButton.addEventListener('click', () => {
                    window.open(url, '_blank');
                });

                teamsContainer.appendChild(card);
            });
        }

        function filterTeams() {
            const searchTerm = searchInput.value.toLowerCase();
            const category = filterSelect.value;

            const filtered = teams.filter(team => {
                const matchesSearch =
                    team.full.toLowerCase().includes(searchTerm) ||
                    team.short.toLowerCase().includes(searchTerm) ||
                    team.code.toLowerCase().includes(searchTerm) ||
                    team.location.toLowerCase().includes(searchTerm) ||
                    team.id.toString().includes(searchTerm);

                const matchesCategory = !category || team.category === category;

                return matchesSearch && matchesCategory;
            });

            renderTeams(filtered.sort((a, b) => a.full.localeCompare(b.full)));
        }

        searchInput.addEventListener('input', filterTeams);
        filterSelect.addEventListener('change', filterTeams);

        // View toggle buttons
        const gridViewBtn = document.getElementById('gridView');
        const listViewBtn = document.getElementById('listView');

        gridViewBtn.addEventListener('click', () => {
            teamsContainer.classList.remove('list-view');
            gridViewBtn.classList.add('active');
            listViewBtn.classList.remove('active');
        });

        listViewBtn.addEventListener('click', () => {
            teamsContainer.classList.add('list-view');
            listViewBtn.classList.add('active');
            gridViewBtn.classList.remove('active');
        });

        renderTeams(teams.sort((a, b) => a.full.localeCompare(b.full)));
    </script>
